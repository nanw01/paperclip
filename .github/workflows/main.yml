name: Sync Main and Master
on:
  push:
    branches:
      - main
      - master

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Branches
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Push to main detected, syncing to master..."
            git checkout master
            git merge main --ff-only || git merge main --strategy-option theirs
            git push origin master
          else
            echo "Push to master detected, syncing to main..."
            git checkout main
            git merge master --ff-only || git merge master --strategy-option theirs
            git push origin main
          fi
